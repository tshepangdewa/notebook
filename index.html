<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notebook</title>


    <!-- Geist + Caveat -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Geist:wght@100..900&display=swap"
        rel="stylesheet"
    >


    <!-- Main stylesheet -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         AUTHENTICATION PAGE
    ========================== -->

    <main
        class="auth-page"
        id="authPage"
    >

        <section class="auth-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    N
                </div>

                <span class="brand-name">
                    Notebook
                </span>

            </div>


            <!-- AUTH HEADER -->

            <div class="auth-header">

                <h1
                    id="authTitle"
                    class="ai-heading"
                >
                    Your notes, understood by AI
                </h1>

                <p id="authSubtitle">
                    Sign in to access your notes.
                </p>

            </div>


            <!-- AUTH FORM -->

            <form id="authForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- AUTH MESSAGE -->

                <p
                    id="authMessage"
                    class="auth-message hidden"
                ></p>


                <!-- SUBMIT BUTTON -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Sign in
                </button>

            </form>


            <!-- AUTH SWITCH -->

            <p class="auth-switch">

                <span id="authSwitchText">
                    Don't have an account?
                </span>

                <button
                    type="button"
                    id="authSwitchButton"
                    class="text-button"
                >
                    Sign up
                </button>

            </p>


        </section>

    </main>


    <!-- =========================
         NOTES PAGE
    ========================== -->

    <main
        class="notes-page hidden"
        id="notesPage"
    >


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    N
                </div>

                <span class="brand-name">
                    Notebook
                </span>

            </div>


            <button
                class="icon-button"
                id="logoutButton"
            >
                Logout
            </button>

        </header>


        <!-- NOTES CONTENT -->

        <section class="notes-content">


            <div class="notes-heading">

                <h1>
                    Your Notes
                </h1>

                <p>
                    Capture your thoughts and let AI make sense of them.
                </p>

            </div>


            <!-- SEARCH -->

            <div class="search-wrapper">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search your notes..."
                >

            </div>


            <!-- NOTES GRID -->

            <div
                class="notes-grid"
                id="notesGrid"
            >
                <!-- Notes will be rendered here later -->
            </div>


        </section>


        <!-- ADD NOTE -->

        <button
            class="add-note-button"
            id="addNoteButton"
        >
            +
        </button>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <!-- Supabase Library -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Supabase Configuration -->

    <script src="js/supabase.js"></script>


    <!-- Notebook Application -->

    <script src="js/app.js"></script>


</body>

</html>
