<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notebook</title>
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <main class="welcome-page">

        <section class="welcome-card">

            <div class="brand">
                <div class="brand-icon">
                    N
                </div>

                <h1>Notebook</h1>
            </div>

            <div class="welcome-content">

                <h2>Your notes, understood by AI.</h2>

                <p>
                    Write, save and organize your thoughts
                    with AI-powered summaries.
                </p>

                <div class="auth-buttons">
                    <button id="signup-btn" class="btn btn-primary">
                        Sign Up
                    </button>

                    <button id="signin-btn" class="btn btn-secondary">
                        Sign In
                    </button>
                </div>

            </div>

        </section>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
