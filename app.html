<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Notes App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-left">
            <h1 class="app-logo">Notes App</h1>
        </div>
        <div class="header-center">
            <input type="text" id="search-input" class="search-bar" placeholder="Search notes...">
        </div>
        <div class="header-right">
            <span id="user-email" class="user-email"></span>
            <button id="signout-btn" class="btn btn-secondary btn-sm">Sign Out</button>
        </div>
    </header>

    <main class="dashboard-container">
        <!-- Quick Create Note Form -->
        <div class="create-note-container">
            <form id="create-note-form" class="create-note-card">
                <input type="text" id="create-title" class="create-input title-input hidden" placeholder="Title" autocomplete="off">
                <textarea id="create-content" class="create-input content-input" placeholder="Take a note..." rows="1"></textarea>
                <div id="create-actions" class="create-actions hidden">
                    <div class="create-options">
                        <button type="button" id="create-pin-btn" class="btn btn-primary btn-sm">Pin</button>
                        <button type="button" id="create-ai-btn" class="btn btn-primary btn-sm">Summarize</button>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                </div>
            </form>
        </div>

        <!-- Controls Toolbar -->
        <div class="toolbar-container">
            <div class="sort-control">
                <label for="sort-select">Sort by:</label>
                <select id="sort-select" class="sort-dropdown">
                    <option value="updated_desc">Recently Updated</option>
                    <option value="created_desc">Newest First</option>
                    <option value="created_asc">Oldest First</option>
                    <option value="title_asc">Title (A-Z)</option>
                </select>
            </div>
        </div>

        <!-- Notes Display Sections -->
        <div id="empty-state" class="empty-state hidden">
            <p>No notes found. Create your first note above!</p>
        </div>

        <!-- Pinned Section -->
        <section id="pinned-section" class="notes-section hidden">
            <h2 class="section-title">Pinned</h2>
            <div id="pinned-grid" class="notes-grid"></div>
        </section>

        <!-- Others Section -->
        <section id="others-section" class="notes-section hidden">
            <h2 id="others-title" class="section-title hidden">Others</h2>
            <div id="others-grid" class="notes-grid"></div>
        </section>
    </main>

    <!-- Note Edit Modal -->
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-body">
                <input type="text" id="modal-title" class="modal-input title-input" placeholder="Title">
                <textarea id="modal-content" class="modal-input content-input" placeholder="Note content..." rows="8"></textarea>
                
                <!-- AI Summary Section -->
                <div id="modal-ai-section" class="modal-ai-section hidden">
                    <label class="modal-label">AI Summary</label>
                    <div id="ai-summary-text" class="ai-summary-box"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="modal-left-actions">
                    <button type="button" id="modal-delete-btn" class="btn btn-danger btn-sm">Delete</button>
                    <button type="button" id="modal-ai-btn" class="btn btn-primary btn-sm">Summarize</button>
                </div>
                <div class="modal-right-actions">
                    <button type="button" id="modal-pin-btn" class="btn btn-primary btn-sm">Pin</button>
                    <button type="button" id="modal-close-btn" class="btn btn-primary btn-sm">Done</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
